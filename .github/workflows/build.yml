name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, win-x64)
        run: >
          dotnet publish VlcNightlyUpdater/VlcNightlyUpdater.csproj
          -c Release -r win-x64 -p:Platform=x64 -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath VlcNightlyUpdater-win-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: VlcNightlyUpdater-win-x64
          path: VlcNightlyUpdater-win-x64.zip

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VlcNightlyUpdater-win-x64.zip
