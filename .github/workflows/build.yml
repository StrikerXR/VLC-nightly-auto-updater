name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write    # create the GitHub Release
  actions: read      # download the build artifacts in the release job

env:
  # Pinned on purpose: the runner image ships an older Inno Setup (6.x). Bump here to move to a newer release.
  INNO_VERSION: 7.1.0

jobs:
  # One version for everything: MAJOR.MINOR from the VERSION file + the run number as the patch.
  version:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.v.outputs.app }}
    steps:
      - uses: actions/checkout@v6

      - id: v
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must look like 2.0 (got '$base')"; exit 1
          fi
          echo "app=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building VLC Nightly Updater v$base.${{ github.run_number }}"

  # The updater itself ships for 32-bit, 64-bit and ARM64 Windows.
  build:
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64, arm64]
        include:
          - arch: x86
            platform: x86
          - arch: x64
            platform: x64
          - arch: arm64
            platform: ARM64
    env:
      APP_VERSION: ${{ needs.version.outputs.app }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish app (self-contained, win-${{ matrix.arch }})
        run: >
          dotnet publish VlcNightlyUpdater/VlcNightlyUpdater.csproj
          -c Release -r win-${{ matrix.arch }} -p:Platform=${{ matrix.platform }}
          -p:Version=${{ env.APP_VERSION }} -o publish

      - name: Install Inno Setup ${{ env.INNO_VERSION }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver  = $env:INNO_VERSION
          $dir  = Join-Path $env:RUNNER_TEMP "InnoSetup-$ver"
          $file = Join-Path $env:RUNNER_TEMP "innosetup-$ver-x64.exe"

          gh release download "is-$($ver -replace '\.','_')" --repo jrsoftware/issrc `
            --pattern "innosetup-$ver-x64.exe" --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $file)) { throw "Couldn't download Inno Setup $ver" }

          $p = Start-Process $file -Wait -PassThru -ArgumentList `
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',"/DIR=`"$dir`""
          if ($p.ExitCode -ne 0) { throw "Inno Setup installer exited with $($p.ExitCode)" }

          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found in $dir" }

          # Fail loudly if we didn't actually get the pinned version.
          $found = (Get-Item $iscc).VersionInfo.ProductVersion
          Write-Host "ISCC reports version $found"
          if (-not $found.StartsWith($ver)) { throw "Expected Inno Setup $ver but ISCC is $found" }

          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV

      - name: Build installer wizard (${{ matrix.arch }})
        shell: pwsh
        run: |
          if (-not (Test-Path publish\VlcNightlyUpdater.exe)) { throw "publish\VlcNightlyUpdater.exe is missing" }
          Write-Host "Using $env:ISCC_PATH"
          New-Item -ItemType Directory -Force dist | Out-Null
          & $env:ISCC_PATH "/DMyAppVersion=$env:APP_VERSION" "/DMyArch=${{ matrix.arch }}" installer\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # GitHub wraps artifacts in a .zip, so each downloads as a zip containing ONLY that setup .exe
      - uses: actions/upload-artifact@v7
        with:
          name: VlcNightlyUpdater-Setup-${{ env.APP_VERSION }}-${{ matrix.arch }}
          path: dist/VlcNightlyUpdater-Setup-${{ env.APP_VERSION }}-${{ matrix.arch }}.exe

  # Runs once, after ALL three installers exist, so the in-app self-updater never sees a half-uploaded release.
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.app }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Collect installers
        run: |
          mkdir -p dl dist
          gh run download "${{ github.run_id }}" --pattern 'VlcNightlyUpdater-Setup-*' --dir dl
          find dl -name 'VlcNightlyUpdater-Setup-*.exe' -exec mv {} dist/ \;
          ls -l dist
          [ "$(ls dist/*.exe | wc -l)" -eq 3 ] || { echo "Expected 3 installers (x86, x64, arm64)"; exit 1; }

      # The in-app self-updater refuses to install anything it can't verify against this file.
      - name: Checksums
        run: |
          cd dist
          sha256sum VlcNightlyUpdater-Setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        run: |
          tag="v$APP_VERSION"
          files=(dist/VlcNightlyUpdater-Setup-*.exe dist/SHA256SUMS.txt)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber        # re-run of the same version
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
              --title "VLC Nightly Updater v$APP_VERSION" --generate-notes --latest
          fi
