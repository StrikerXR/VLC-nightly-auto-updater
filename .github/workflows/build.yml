name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write    # create the GitHub Release
  actions: read      # download build artifacts

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      app: ${{ steps.v.outputs.app }}
    steps:
      - uses: actions/checkout@v7

      - id: v
        run: |
          ver=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must look like 2.1.0 (got '$ver')"; exit 1
          fi
          echo "app=$ver" >> "$GITHUB_OUTPUT"
          echo "Building VLC Nightly Updater v$ver"

  build:
    needs: version
    runs-on: windows-latest
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            platform: x64
          - arch: arm64
            platform: ARM64
            experimental: true
    env:
      APP_VERSION: ${{ needs.version.outputs.app }}
    steps:
      - uses: actions/checkout@v7

      # Setup .NET with NuGet caching
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/VlcNightlyUpdater.csproj'

      - name: Publish app (self-contained, win-${{ matrix.arch }})
        run: >
          dotnet publish VlcNightlyUpdater/VlcNightlyUpdater.csproj
          -c Release -r win-${{ matrix.arch }} -p:Platform=${{ matrix.platform }}
          -p:Version=${{ env.APP_VERSION }} -o publish

      - name: Ensure dist directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null

      - name: Build installer
        shell: pwsh
        env:
          VLCNU_VERSION: ${{ env.APP_VERSION }}
          VLCNU_ARCH: ${{ matrix.arch }}
          VLCNU_EDITION: modern
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v7
        with:
          name: VlcNightlyUpdater-Setup-${{ env.APP_VERSION }}-${{ matrix.arch }}
          path: dist/VlcNightlyUpdater-Setup-${{ env.APP_VERSION }}-${{ matrix.arch }}.exe

  build-legacy:
    needs: version
    runs-on: windows-latest
    continue-on-error: true   # optional edition: a failure here never blocks the main release
    env:
      APP_VERSION: ${{ needs.version.outputs.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish Legacy app (.NET 6, self-contained, win-x64)
        run: >
          dotnet publish VlcNightlyUpdater.Legacy/VlcNightlyUpdater.Legacy.csproj
          -c Release -r win-x64 -p:Version=${{ env.APP_VERSION }} -o publish-legacy

      - name: Ensure dist directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null

      - name: Build installer
        shell: pwsh
        env:
          VLCNU_VERSION: ${{ env.APP_VERSION }}
          VLCNU_ARCH: x64
          VLCNU_EDITION: legacy
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v7
        with:
          name: VlcNightlyUpdater-Setup-${{ env.APP_VERSION }}-x64-legacy
          path: dist/VlcNightlyUpdater-Setup-${{ env.APP_VERSION }}-x64-legacy.exe

  release:
    needs: [version, build, build-legacy]
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    runs-on: ubuntu-26.04
    env:
      APP_VERSION: ${{ needs.version.outputs.app }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: VlcNightlyUpdater-Setup-*
          path: dist
          merge-multiple: true

      - name: Validate installers
        run: |
          ls -l dist
          ls dist/*-x64.exe > /dev/null 2>&1 || { echo "The x64 installer is missing, refusing to release"; exit 1; }
          ls dist/*-arm64.exe > /dev/null 2>&1 || echo "::warning::ARM64 installer missing, releasing x64 only"

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum VlcNightlyUpdater-Setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        run: |
          tag="v$APP_VERSION"
          files=(dist/VlcNightlyUpdater-Setup-*.exe dist/SHA256SUMS.txt)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
              --title "VLC Nightly Updater v$APP_VERSION" --generate-notes --latest
          fi

      - name: Output Step Summary
        run: |
          echo "### 🚀 Released VLC Nightly Updater v$APP_VERSION" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat dist/SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
