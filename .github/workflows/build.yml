name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # One version for everything: MAJOR.MINOR from the VERSION file + the run number as the patch.
      - name: Compute version
        shell: pwsh
        run: |
          $base = (Get-Content VERSION -Raw).Trim()
          if ($base -notmatch '^\d+\.\d+$') { throw "VERSION must look like 1.0 (got '$base')" }
          $ver = "$base.${{ github.run_number }}"
          "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "Building VLC Nightly Updater v$ver"

      - name: Publish app (self-contained, win-x64)
        run: >
          dotnet publish VlcNightlyUpdater/VlcNightlyUpdater.csproj
          -c Release -r win-x64 -p:Platform=x64 -p:Version=${{ env.APP_VERSION }} -o publish

      - name: Build installer wizard
        shell: pwsh
        run: |
          if (-not (Test-Path publish\VlcNightlyUpdater.exe)) { throw "publish\VlcNightlyUpdater.exe is missing" }

          function Find-Iscc {
            Get-ChildItem -Path $env:ProgramFiles, ${env:ProgramFiles(x86)} `
              -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
          }

          $iscc = Find-Iscc
          if (-not $iscc) { throw "ISCC.exe not found" }

          # Dark wizard style needs Inno Setup 6.6+. Upgrade only if the runner's copy is older.
          try {
            if ([version]$iscc.VersionInfo.ProductVersion -lt [version]'6.6.0') {
              Write-Host "Inno Setup $($iscc.VersionInfo.ProductVersion) is too old, upgrading..."
              choco upgrade innosetup -y --no-progress
              $iscc = Find-Iscc
            }
          } catch { Write-Host "Couldn't read Inno Setup version, continuing: $_" }

          Write-Host "Using $($iscc.FullName)"
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc.FullName "/DMyAppVersion=${{ env.APP_VERSION }}" installer\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # GitHub wraps artifacts in a .zip, so this downloads as a zip containing ONLY the versioned setup .exe
      - uses: actions/upload-artifact@v7
        with:
          name: VlcNightlyUpdater-Setup-${{ env.APP_VERSION }}
          path: dist/VlcNightlyUpdater-Setup-${{ env.APP_VERSION }}.exe

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag  = "v$env:APP_VERSION"
          $file = "dist/VlcNightlyUpdater-Setup-$env:APP_VERSION.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file --clobber        # re-run of the same version
          } else {
            gh release create $tag $file --target $env:GITHUB_SHA `
              --title "VLC Nightly Updater v$env:APP_VERSION" --generate-notes --latest
          }
