name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish app (self-contained, win-x64)
        run: >
          dotnet publish VlcNightlyUpdater/VlcNightlyUpdater.csproj
          -c Release -r win-x64 -p:Platform=x64 -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer wizard
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=1.0.${{ github.run_number }}" installer\installer.iss

      # GitHub wraps artifacts in a .zip, so this downloads as a zip containing ONLY the setup .exe
      - uses: actions/upload-artifact@v4
        with:
          name: VlcNightlyUpdater-Setup
          path: dist/VlcNightlyUpdater-Setup.exe

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VlcNightlyUpdater-Setup.exe
