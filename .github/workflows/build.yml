name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write    # create the GitHub Release
  actions: read      # download the build artifacts in the release job

jobs:
  # One version for everything: MAJOR.MINOR from the VERSION file + the run number as the patch.
  version:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.v.outputs.app }}
    steps:
      - uses: actions/checkout@v6

      - id: v
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must look like 2.0 (got '$base')"; exit 1
          fi
          echo "app=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building VLC Nightly Updater v$base.${{ github.run_number }}"

  # The updater ships for 64-bit and ARM64 Windows 11 (25H2+). ARM64 is best-effort: if it fails, x64 still releases.
  build:
    needs: version
    runs-on: windows-latest
    # x64 is primary. A failed ARM64 build must not fail the run or block the release.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            platform: x64
          - arch: arm64
            platform: ARM64
            experimental: true
    env:
      APP_VERSION: ${{ needs.version.outputs.app }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish app (self-contained, win-${{ matrix.arch }})
        run: >
          dotnet publish VlcNightlyUpdater/VlcNightlyUpdater.csproj
          -c Release -r win-${{ matrix.arch }} -p:Platform=${{ matrix.platform }}
          -p:Version=${{ env.APP_VERSION }} -o publish

      # Use whatever Inno Setup the runner already has. No version pinning.
      - name: Locate Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) {
            Write-Host "Inno Setup not found on the runner, installing it with Chocolatey"
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "Using $iscc"
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV

      - name: Build installer wizard (${{ matrix.arch }})
        shell: pwsh
        run: |
          if (-not (Test-Path publish\VlcNightlyUpdater.exe)) { throw "publish\VlcNightlyUpdater.exe is missing" }
          Write-Host "Using $env:ISCC_PATH"
          New-Item -ItemType Directory -Force dist | Out-Null
          & $env:ISCC_PATH "/DMyAppVersion=$env:APP_VERSION" "/DMyArch=${{ matrix.arch }}" installer\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # GitHub wraps artifacts in a .zip, so each downloads as a zip containing ONLY that setup .exe
      - uses: actions/upload-artifact@v7
        with:
          name: VlcNightlyUpdater-Setup-${{ env.APP_VERSION }}-${{ matrix.arch }}
          path: dist/VlcNightlyUpdater-Setup-${{ env.APP_VERSION }}-${{ matrix.arch }}.exe

  # Runs once, after the installers exist (x64 required, ARM64 if it built), so the in-app self-updater never sees a half-uploaded release.
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.app }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Collect installers
        run: |
          mkdir -p dl dist
          gh run download "${{ github.run_id }}" --pattern 'VlcNightlyUpdater-Setup-*' --dir dl
          find dl -name 'VlcNightlyUpdater-Setup-*.exe' -exec mv {} dist/ \;
          ls -l dist
          ls dist/*-x64.exe > /dev/null 2>&1 || { echo "The x64 installer is missing, refusing to release"; exit 1; }
          ls dist/*-arm64.exe > /dev/null 2>&1 || echo "::warning::ARM64 installer missing, releasing x64 only"

      # The in-app self-updater refuses to install anything it can't verify against this file.
      - name: Checksums
        run: |
          cd dist
          sha256sum VlcNightlyUpdater-Setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        run: |
          tag="v$APP_VERSION"
          files=(dist/VlcNightlyUpdater-Setup-*.exe dist/SHA256SUMS.txt)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber        # re-run of the same version
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
              --title "VLC Nightly Updater v$APP_VERSION" --generate-notes --latest
          fi
