name: Build & Release

# Manual only: Actions > Build & Release > Run workflow.
# Untick "release" for a build-and-test dry run that publishes nothing.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (untick for a build-and-test dry run)"
        type: boolean
        default: true
      arm64:
        description: "Also build the ARM64 installer (best-effort, never blocks the release)"
        type: boolean
        default: true
      prerelease:
        description: "Mark the release as a pre-release (the in-app self-updater ignores pre-releases)"
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft so you can review it first"
        type: boolean
        default: false
      notes:
        description: "Extra release notes shown above the auto-generated changelog (optional)"
        type: string
        default: ""

# Runs queue up one at a time and are never cancelled half-way.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Least privilege by default; the jobs that need more ask for it themselves.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------------------------------------
  # One version for everything: the full MAJOR.MINOR.PATCH from the VERSION file (e.g. 3.0.0).
  # Bump VERSION to release a new version; an installed 2.x sees 3.0.0 as newer and updates itself.
  # ---------------------------------------------------------------------------------------------
  version:
    name: Resolve version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.v.outputs.app }}
      tag: ${{ steps.v.outputs.tag }}
      status: ${{ steps.v.outputs.status }}
      matrix: ${{ steps.v.outputs.matrix }}
      arm64: ${{ steps.v.outputs.arm64 }}
    steps:
      - uses: actions/checkout@v7

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_RELEASE: ${{ inputs.release }}
          WANT_ARM64: ${{ inputs.arm64 }}
        run: |
          set -euo pipefail

          ver=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must look like 3.0.0 (got '$ver')"; exit 1
          fi

          # Compare against the newest published release (none yet is fine).
          # No release yet is fine: gh exits non-zero with an empty stdout, and anything that isn't a plain version is ignored.
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          latest=${latest#v}
          [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || latest=""
          status=new
          if [[ -n "$latest" ]]; then
            if [[ "$ver" == "$latest" ]]; then
              status=rerun
            elif [[ "$(printf '%s\n%s\n' "$ver" "$latest" | sort -V | head -n1)" == "$ver" ]]; then
              status=older
            fi
          fi

          if [[ "$status" == "older" ]]; then
            if [[ "$WANT_RELEASE" == "true" ]]; then
              echo "::error file=VERSION::VERSION $ver is older than the latest release v$latest. Installed copies would never see it. Bump VERSION."
              exit 1
            fi
            echo "::warning file=VERSION::VERSION $ver is older than the latest release v$latest"
          fi

          # Soft check: the fallback defaults in the csproj / installer should match VERSION.
          for f in VlcNightlyUpdater/VlcNightlyUpdater.csproj installer/installer.iss; do
            grep -q "$ver" "$f" || echo "::warning file=$f::Default version in this file doesn't match VERSION ($ver). CI overrides it, but local builds will differ."
          done

          # Build matrix: x64 is required, ARM64 is best-effort and can be switched off.
          if [[ "$WANT_ARM64" == "true" ]]; then
            matrix='{"include":[{"arch":"x64","platform":"x64","experimental":false},{"arch":"arm64","platform":"ARM64","experimental":true}]}'
          else
            matrix='{"include":[{"arch":"x64","platform":"x64","experimental":false}]}'
          fi

          {
            echo "app=$ver"
            echo "tag=v$ver"
            echo "status=$status"
            echo "arm64=$WANT_ARM64"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## VLC Nightly Updater v$ver"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$ver\` |"
            echo "| Latest published | \`${latest:-none}\` |"
            echo "| Status | $status |"
            echo "| Release requested | $WANT_RELEASE |"
            echo "| ARM64 | $WANT_ARM64 |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  # Windows 10 (1809+) and Windows 11, 64-bit and ARM64. ARM64 is best-effort: if it fails,
  # x64 still releases.
  # ---------------------------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    # x64 is primary. A failed ARM64 build must not fail the run or block the release.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    env:
      APP_VERSION: ${{ needs.version.outputs.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.arch }}-

      - name: Publish app (self-contained, win-${{ matrix.arch }})
        run: >
          dotnet publish VlcNightlyUpdater/VlcNightlyUpdater.csproj
          -c Release -r win-${{ matrix.arch }} -p:Platform=${{ matrix.platform }}
          -p:Version=${{ env.APP_VERSION }} -p:ContinuousIntegrationBuild=true
          --nologo -v:m -o publish

      # Catch a wrong-CPU build before it ever reaches a user: read the PE header of the exe.
      - name: Verify the published exe is really ${{ matrix.arch }}
        shell: pwsh
        run: |
          $exe = "publish\VlcNightlyUpdater.exe"
          if (-not (Test-Path $exe)) { throw "$exe is missing" }
          $fs = [IO.File]::OpenRead((Resolve-Path $exe))
          try {
            $buf = New-Object byte[] 4096
            [void]$fs.Read($buf, 0, $buf.Length)
          } finally { $fs.Dispose() }
          $pe      = [BitConverter]::ToInt32($buf, 0x3C)
          $machine = [BitConverter]::ToUInt16($buf, $pe + 4)
          $expected = if ("${{ matrix.arch }}" -eq "arm64") { 0xAA64 } else { 0x8664 }
          Write-Host ("PE machine type: 0x{0:X4} (expected 0x{1:X4})" -f $machine, $expected)
          if ($machine -ne $expected) { throw "VlcNightlyUpdater.exe is not a ${{ matrix.arch }} binary" }
          foreach ($f in "Assets\app.ico", "Assets\app-christmas.ico") {
            if (-not (Test-Path "publish\$f")) { throw "publish\$f is missing" }
          }

      # Use whatever Inno Setup the runner already has. No version pinning.
      - name: Locate Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) {
            Write-Host "Inno Setup not found on the runner, installing it with Chocolatey"
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "Using $iscc"
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV

      - name: Build installer wizard (${{ matrix.arch }})
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & $env:ISCC_PATH "/DMyAppVersion=$env:APP_VERSION" "/DMyArch=${{ matrix.arch }}" installer\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "dist\VlcNightlyUpdater-Setup-$env:APP_VERSION-${{ matrix.arch }}.exe"
          if (-not (Test-Path $setup)) { throw "$setup was not produced" }
          $mb = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "Built $setup ($mb MB)"

      # Install -> check -> uninstall -> check, on the runner. Per-user setup, so no admin needed.
      # The ARM64 installer can't run on an x64 runner, so only x64 is exercised here.
      - name: Smoke test installer (install, verify, uninstall)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $setup  = (Resolve-Path "dist\VlcNightlyUpdater-Setup-$env:APP_VERSION-x64.exe").Path
          $appDir = Join-Path $env:LOCALAPPDATA "Programs\VLC Nightly Updater"
          $key    = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{B3F1C2A4-7D5E-4A9B-9C21-5E8F0A6D1B77}_is1"

          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }

          if (-not (Test-Path (Join-Path $appDir "VlcNightlyUpdater.exe"))) { throw "App was not installed to $appDir" }
          $installed = (Get-ItemProperty $key).DisplayVersion
          if ($installed -ne $env:APP_VERSION) { throw "Registry says $installed, expected $env:APP_VERSION" }
          Write-Host "Installed $installed OK"

          # Reinstall over the top must succeed too (this is what an update does).
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Re-install exited with $($p.ExitCode)" }
          Write-Host "Re-install OK"

          $unins = Join-Path $appDir "unins000.exe"
          if (-not (Test-Path $unins)) { throw "Uninstaller missing" }
          Start-Process $unins -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait | Out-Null

          # Inno's uninstaller hands off to a temp copy, so poll until it has really finished.
          $deadline = (Get-Date).AddSeconds(90)
          while ((Test-Path $appDir) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $appDir)  { throw "Uninstall left $appDir behind" }
          if (Test-Path $key)     { throw "Uninstall left its registry key behind" }
          Write-Host "Uninstall left no trace"

      # GitHub wraps artifacts in a .zip, so each downloads as a zip containing ONLY that setup .exe
      - uses: actions/upload-artifact@v7
        with:
          name: VlcNightlyUpdater-Setup-${{ env.APP_VERSION }}-${{ matrix.arch }}
          path: dist/VlcNightlyUpdater-Setup-${{ env.APP_VERSION }}-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $setup = "dist\VlcNightlyUpdater-Setup-$env:APP_VERSION-${{ matrix.arch }}.exe"
          if (Test-Path $setup) {
            $f = Get-Item $setup
            "- :white_check_mark: **${{ matrix.arch }}** ``$($f.Name)`` ($([math]::Round($f.Length / 1MB, 1)) MB)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "- :x: **${{ matrix.arch }}** build failed" >> $env:GITHUB_STEP_SUMMARY
          }

  # ---------------------------------------------------------------------------------------------
  # Runs once, after the installers exist (x64 required, ARM64 if it built), so the in-app
  # self-updater never sees a half-uploaded release.
  # ---------------------------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [version, build]
    if: ${{ inputs.release }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write        # create the GitHub Release (POST /releases)
      actions: read          # download the build artifacts in this job
      id-token: write        # build provenance attestation
      attestations: write
      # Everything not listed above is "none" once a job sets `permissions`.
    env:
      APP_VERSION: ${{ needs.version.outputs.app }}
      TAG: ${{ needs.version.outputs.tag }}
      WANT_ARM64: ${{ needs.version.outputs.arm64 }}
      # Uses the repo secret RELEASE_TOKEN (a PAT with Contents: read/write) if you add one,
      # otherwise the built-in token. The PAT is the fallback for repos/orgs where the built-in
      # token is forced read-only and cannot create releases (HTTP 403).
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Collect installers
        run: |
          set -euo pipefail
          mkdir -p dl dist
          gh run download "${{ github.run_id }}" --pattern 'VlcNightlyUpdater-Setup-*' --dir dl
          find dl -name 'VlcNightlyUpdater-Setup-*.exe' -exec mv {} dist/ \;
          ls -l dist
          [[ -f "dist/VlcNightlyUpdater-Setup-$APP_VERSION-x64.exe" ]] || { echo "::error::The x64 installer is missing, refusing to release"; exit 1; }
          if [[ ! -f "dist/VlcNightlyUpdater-Setup-$APP_VERSION-arm64.exe" && "$WANT_ARM64" == "true" ]]; then
            echo "::warning::ARM64 installer missing, releasing x64 only"
          fi

      # The in-app self-updater refuses to install anything it can't verify against this file.
      - name: Checksums
        run: |
          cd dist
          sha256sum VlcNightlyUpdater-Setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed build provenance (public repos). Never blocks a release.
      - name: Attest build provenance
        if: ${{ github.event.repository.private == false }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/VlcNightlyUpdater-Setup-*.exe

      - name: Write release notes
        env:
          EXTRA_NOTES: ${{ inputs.notes }}
        run: |
          {
            if [[ -n "$EXTRA_NOTES" ]]; then
              printf '%s\n\n' "$EXTRA_NOTES"
            fi
            echo "### Install"
            echo "Run the setup that matches your PC. Already have the updater? It will offer this update itself."
            echo ""
            echo "| Your PC | Download |"
            echo "|---|---|"
            echo "| Windows 10 (1809+) or 11, 64-bit (Intel / AMD) | \`VlcNightlyUpdater-Setup-$APP_VERSION-x64.exe\` |"
            if [[ -f "dist/VlcNightlyUpdater-Setup-$APP_VERSION-arm64.exe" ]]; then
              echo "| Windows 11 / 10 on ARM64 | \`VlcNightlyUpdater-Setup-$APP_VERSION-arm64.exe\` |"
            fi
            echo ""
            echo "Verify a download: \`sha256sum -c SHA256SUMS.txt\` (Linux/macOS) or \`Get-FileHash <file>\` (PowerShell) and compare with \`SHA256SUMS.txt\`."
            echo ""
            echo "### What's changed"
          } > notes.md

      - name: Publish GitHub Release
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          files=(dist/VlcNightlyUpdater-Setup-*.exe dist/SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber        # re-run of the same version
          else
            args=(--target "$GITHUB_SHA" --title "VLC Nightly Updater v$APP_VERSION" --notes-file notes.md --generate-notes)
            [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease) || args+=(--latest)
            [[ "$DRAFT" == "true" ]] && args+=(--draft)
            if ! gh release create "$TAG" "${files[@]}" "${args[@]}" 2> create.err; then
              cat create.err
              if grep -q "403" create.err; then
                echo "::error::GitHub refused to create the release (403). Fix: repo Settings > Actions > General > Workflow permissions > select 'Read and write permissions' (if greyed out, an org/enterprise policy is forcing read-only), OR add a repo secret RELEASE_TOKEN holding a PAT with Contents: Read and write."
              fi
              exit 1
            fi
          fi

      # Download what GitHub now serves and check it against SHA256SUMS.txt, exactly like the self-updater will.
      - name: Verify the published release
        run: |
          set -euo pipefail
          mkdir verify
          gh release download "$TAG" --dir verify --clobber
          cd verify
          sha256sum -c SHA256SUMS.txt
          [[ -f "VlcNightlyUpdater-Setup-$APP_VERSION-x64.exe" ]] || { echo "::error::x64 installer missing from the release"; exit 1; }

      - name: Summary
        run: |
          url=$(gh release view "$TAG" --json url --jq .url)
          {
            echo "## :rocket: Released $TAG"
            echo ""
            echo "$url"
            echo ""
            echo "| File | SHA-256 |"
            echo "|---|---|"
            while read -r sum name; do echo "| \`${name#\*}\` | \`$sum\` |"; done < dist/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"
